<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapping 对照查询器</title>
<style>
  :root {
    --bg: #fbfbfa;
    --panel: #ffffff;
    --fg: #1c1f23;
    --muted: #6b7280;
    --line: #e3e4e6;
    --accent: #0f766e;
    --sel: #ecfdf5;
    --chip: #f1f2f4;
    --chip-on: #0f766e;
    --chip-on-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013;
      --panel: #15181d;
      --fg: #e6e7e9;
      --muted: #9aa1a9;
      --line: #262a31;
      --accent: #5eead4;
      --sel: #10262a;
      --chip: #1c2027;
      --chip-on: #5eead4;
      --chip-on-fg: #06231f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  code, .mono, .name {
    font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
    font-size: 12.5px;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 10px 16px 8px;
    background: var(--panel);
    flex: none;
  }
  .topline { display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  .ver { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
  .ver input {
    width: 74px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 12px;
  }
  .ver button {
    padding: 3px 8px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--chip); color: var(--fg); font: inherit; font-size: 12px; cursor: pointer;
  }
  .searchrow { display: flex; gap: 10px; align-items: center; margin-top: 9px; }
  #q {
    flex: 1; padding: 8px 11px; font-size: 14px; border: 1px solid var(--line);
    border-radius: 7px; background: var(--bg); color: var(--fg); outline: none;
  }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent); }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .chip {
    padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--chip); color: var(--muted); font-size: 11.5px; cursor: pointer; user-select: none;
  }
  .chip.on { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-fg); }
  .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
  .chipgroup { display: flex; gap: 5px; align-items: center; margin-left: auto; padding-left: 10px; }
  main { flex: 1; display: flex; min-height: 0; }
  #listpane {
    width: 390px; flex: none; border-right: 1px solid var(--line);
    overflow-y: auto; background: var(--panel);
  }
  #detailpane { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
  .item {
    padding: 7px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .item:hover { background: var(--sel); }
  .item.on { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .item .l1 { display: flex; gap: 7px; align-items: baseline; }
  .badge {
    font-size: 10px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line);
    color: var(--muted); flex: none; line-height: 15px;
  }
  .badge.c { color: var(--accent); border-color: currentColor; }
  .item .n1 { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .n2 { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  mark { background: transparent; color: var(--accent); font-weight: 600; }
  .empty { color: var(--muted); padding: 24px 16px; font-size: 13px; }
  .card { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); overflow: hidden; margin-bottom: 16px; }
  .card h2 { margin: 0; padding: 9px 14px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line); background: var(--chip); }
  table.names { width: 100%; border-collapse: collapse; }
  table.names td { padding: 5px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.names tr:last-child td { border-bottom: 0; }
  table.names td.k { width: 150px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  table.names td.v { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; word-break: break-all; }
  .row { display: flex; gap: 8px; align-items: baseline; }
  .row .spacer { flex: 1; }
  .copy {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 4px; font-size: 10.5px; padding: 0 5px; cursor: pointer; opacity: 0; transition: opacity .1s;
  }
  tr:hover .copy, .copy:focus { opacity: 1; }
  .copy:hover { color: var(--accent); border-color: var(--accent); }
  .link { color: var(--accent); cursor: pointer; text-decoration: none; }
  .link:hover { text-decoration: underline; }
  .dash { color: var(--muted); }
  table.mem { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.mem th {
    text-align: left; font-weight: 500; color: var(--muted); font-size: 11px;
    padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
    position: sticky; top: 0; background: var(--panel);
  }
  table.mem td { padding: 4px 8px; border-bottom: 1px solid var(--line); font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; vertical-align: top; }
  table.mem tr:hover td { background: var(--sel); }
  table.mem td.m { max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ty { color: var(--muted); cursor: pointer; }
  .ty:hover { color: var(--accent); text-decoration: underline; }
  .tabs { display: flex; gap: 4px; padding: 8px 14px 0; }
  .tab { padding: 3px 10px; border-radius: 5px 5px 0 0; font-size: 12px; cursor: pointer; color: var(--muted); border: 1px solid transparent; border-bottom: 0; }
  .tab.on { color: var(--fg); background: var(--bg); border-color: var(--line); }
  footer {
    flex: none; border-top: 1px solid var(--line); padding: 5px 16px;
    color: var(--muted); font-size: 11.5px; display: flex; gap: 14px; background: var(--panel);
  }
  .hint { color: var(--muted); font-size: 12px; }
  .hint b { color: var(--fg); font-weight: 500; }
  kbd {
    font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; padding: 0 4px;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <div class="topline">
    <h1>Mapping 对照查询器 <span id="verlabel">1.12.2</span></h1>
    <div class="ver">
      <span>版本</span>
      <input id="verinput" value="1.12.2" spellcheck="false">
      <button id="verbBtn">切换</button>
    </div>
  </div>
  <div class="searchrow">
    <input id="q" placeholder="类名 / 方法名 / 字段名，支持「类.成员」如 ItemEntity.damage —— 任意命名空间、部分匹配" spellcheck="false" autocomplete="off">
  </div>
  <div class="chips" id="nsChips">
    <span class="chip on" data-ns="all">全部</span>
    <span class="chip" data-ns="mcp">MCP</span>
    <span class="chip" data-ns="feather1">Feather gen1</span>
    <span class="chip" data-ns="feather2">Feather gen2</span>
    <span class="chip" data-ns="inter">intermediary</span>
    <span class="chip" data-ns="obf">混淆名</span>
    <span class="sep"></span>
    <span class="chip on" data-kind="all">全部</span>
    <span class="chip" data-kind="class">类</span>
    <span class="chip" data-kind="field">字段</span>
    <span class="chip" data-kind="method">方法</span>
    <span class="chipgroup" id="feaToggles">
      <span class="chip on" data-fea="1" title="显示 / 隐藏 gen1 的 intermediary 与 Feather 名字">gen1</span>
      <span class="chip on" data-fea="2" title="显示 / 隐藏 gen2 的 intermediary 与 Feather 名字">gen2</span>
    </span>
  </div>
</header>
<main>
  <div id="listpane"><div class="empty" id="listempty">正在加载索引…</div></div>
  <div id="detailpane"></div>
</main>
<footer>
  <span id="stat">—</span>
  <span id="timing"></span>
  <span style="margin-left:auto"><kbd>/</kbd> 聚焦 · <kbd>↑↓</kbd> 选择 · <kbd>Enter</kbd> 展开 · <kbd>Esc</kbd> 清空</span>
</footer>
<script>
(function () {
  "use strict";
  var NS = ["obf", "mcp", "inter1", "feather1", "inter2", "feather2"];
  var NS_LABEL = {
    obf: "混淆名",
    mcp: "MCP",
    inter1: "intermediary gen1",
    feather1: "Feather gen1",
    inter2: "intermediary gen2",
    feather2: "Feather gen2"
  };
  var M_OBF = 0, M_SRG = 1, M_NAMED = 2, M_I1 = 3, M_F1 = 4, M_I2 = 5, M_F2 = 6, M_DESC = 7;
  var SLOT_NS = [0, 1, 1, 2, 3, 4, 5];
  // 类名数组只有 6 列：obf / mcp(srg) / inter1 / feather1 / inter2 / feather2（没有独立 named 槽）
  var C_OBF = 0, C_MCP = 1, C_I1 = 2, C_F1 = 3, C_I2 = 4, C_F2 = 5;

  var DATA = null;
  var rows = [];
  var lower = null;
  var classLower = null;
  var obfToFeather2 = new Map();
  var byObf = new Map();
  var state = {
    q: "",
    ns: null,
    kind: null,
    hits: [],
    sel: -1,
    view: null,
    showG1: true,   // 详情面板里是否显示 gen1（intermediary + Feather）
    showG2: true    // 详情面板里是否显示 gen2（intermediary + Feather）
  };
  var MAX_HITS = 300;
  var timings = {};

  var $q = document.getElementById("q");
  var $list = document.getElementById("listpane");
  var $detail = document.getElementById("detailpane");
  var $stat = document.getElementById("stat");
  var $timing = document.getElementById("timing");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function simple(name) {
    if (!name) return "";
    var i = name.lastIndexOf("/");
    return i < 0 ? name : name.slice(i + 1);
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("无法加载 " + src)); };
      document.head.appendChild(s);
    });
  }

  function buildRows() {
    rows = [];
    var cls = DATA.classes;
    for (var ci = 0; ci < cls.length; ci++) {
      var names = cls[ci][0];
      rows.push({ k: 0, ci: ci, names: names, desc: "" });
      var fields = cls[ci][1], methods = cls[ci][2];
      for (var i = 0; i < fields.length; i++) {
        rows.push({ k: 1, ci: ci, names: fields[i].slice(0, 7), desc: fields[i][M_DESC] });
      }
      for (var j = 0; j < methods.length; j++) {
        rows.push({ k: 2, ci: ci, names: methods[j].slice(0, 7), desc: methods[j][M_DESC] });
      }
    }
    for (var c = 0; c < cls.length; c++) {
      var n = cls[c][0];
      byObf.set(n[C_OBF], c);
      if (n[C_F2]) obfToFeather2.set(n[C_OBF], n[C_F2]);
    }
  }

  function buildLower() {
    var out = new Array(rows.length);
    for (var i = 0; i < rows.length; i++) {
      var ns = rows[i].names, lc = new Array(ns.length);
      for (var j = 0; j < ns.length; j++) lc[j] = ns[j] ? ns[j].toLowerCase() : "";
      out[i] = lc;
    }
    lower = out;
    var cls = DATA.classes, cl = new Array(cls.length);
    for (var c = 0; c < cls.length; c++) {
      var n = cls[c][0], l = new Array(6);
      for (var j = 0; j < 6; j++) l[j] = n[j] ? n[j].toLowerCase() : "";
      cl[c] = l;
    }
    classLower = cl;
  }

  function scoreName(q, name, lc) {
    if (!name) return 0;
    var low = lc || name.toLowerCase();
    if (low === q) return 100;
    var i = low.lastIndexOf("/");
    if ((i < 0 ? low : low.slice(i + 1)) === q) return 92;
    if (low.length > q.length + 1 && low.slice(-(q.length + 1)) === "/" + q) return 85;
    if (low.indexOf(q) >= 0) return 65;
    return 0;
  }

  function search(q) {
    var ql = q.trim().toLowerCase();
    if (!ql) return [];
    var ns = state.ns, kind = state.kind;
    var cls = DATA.classes;

    // 支持「类.成员」：最后一个点之前是类名，之后是成员名
    var ownerQ = null, memQ = null;
    var dot = ql.lastIndexOf(".");
    if (dot > 0 && dot < ql.length - 1) {
      ownerQ = ql.slice(0, dot).replace(/\./g, "/");
      memQ = ql.slice(dot + 1);
    }
    var nameQ = ql.replace(/\./g, "/");

    var out = [];
    for (var ri = 0; ri < rows.length; ri++) {
      var row = rows[ri];
      if (kind !== null && kind !== row.k) continue;
      var names = row.names;
      var best = 0, bestI = 0;
      var lcRow = lower ? lower[ri] : null;

      // (a) 名字匹配：类全名 / 成员名（点号归一化成斜杠）
      for (var i = 0; i < names.length; i++) {
        if (ns !== null && ns.indexOf(SLOT_NS[i]) < 0) continue;
        var s = scoreName(nameQ, names[i], lcRow ? lcRow[i] : null);
        if (s > best) { best = s; bestI = i; }
      }

      // (b) 「类.成员」匹配：所属类与成员名都要命中
      if (ownerQ && row.k !== 0) {
        var ownerNames = cls[row.ci][0];
        var cLow = classLower ? classLower[row.ci] : null;
        var ob = 0;
        for (var c = 0; c < 6; c++) {
          if (ns !== null && ns.indexOf(c) < 0) continue;
          var os = scoreName(ownerQ, ownerNames[c], cLow ? cLow[c] : null);
          if (os > ob) ob = os;
        }
        if (ob) {
          var mb = 0, mbi = 0;
          for (var s = 0; s < 7; s++) {
            if (ns !== null && ns.indexOf(SLOT_NS[s]) < 0) continue;
            var ms = scoreName(memQ, names[s], lcRow ? lcRow[s] : null);
            if (ms > mb) { mb = ms; mbi = s; }
          }
          if (mb) {
            var combined = Math.min(ob, mb);
            if (combined > best) { best = combined; bestI = mbi; }
          }
        }
      }

      if (!best) continue;
      out.push({ ri: ri, row: row, score: best, bi: bestI });
      if (out.length >= MAX_HITS * 4) break;
    }
    out.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      if (a.row.k !== b.row.k) return a.row.k - b.row.k;
      var an = cls[a.row.ci][0][C_MCP] || cls[a.row.ci][0][C_F2] || "";
      var bn = cls[b.row.ci][0][C_MCP] || cls[b.row.ci][0][C_F2] || "";
      return an < bn ? -1 : an > bn ? 1 : 0;
    });
    return out.slice(0, MAX_HITS);
  }

  function hl(text, q) {
    if (!q || !text) return esc(text || "");
    var low = text.toLowerCase(), pos = low.indexOf(q);
    if (pos < 0) return esc(text);
    return esc(text.slice(0, pos)) + "<mark>" + esc(text.slice(pos, pos + q.length)) + "</mark>" + esc(text.slice(pos + q.length));
  }

  function primaryName(row) {
    var n = row.names;
    if (row.k === 0) return n[C_MCP] || n[C_F2] || n[C_F1] || n[C_OBF];
    return n[M_SRG] || n[M_OBF] || n[M_F2] || n[M_F1] || "?";
  }

  function renderList() {
    var q = state.q.trim().toLowerCase();
    var hlQ = q;
    var dot = q.lastIndexOf(".");
    if (dot > 0 && dot < q.length - 1) hlQ = q.slice(dot + 1);
    if (!state.hits.length) {
      $list.innerHTML = state.q
        ? '<div class="empty">没有匹配。<br>提示：默认不显示 &lt;init&gt; 构造函数；试试部分名，如 <b>player</b>，或「类.成员」如 <b>ItemEntity.damage</b>。</div>'
        : '<div class="empty">输入类名 / 方法名 / 字段名开始查询，也支持「类.成员」。<br><br>例如：<b>ClientPlayerEntity</b>、<b>openScreen</b>、<b>ItemEntity.damage</b></div>';
      return;
    }
    var html = [];
    for (var i = 0; i < state.hits.length; i++) {
      var h = state.hits[i], row = h.row;
      var badge = row.k === 0 ? "类" : row.k === 1 ? "字段" : "方法";
      var n1 = row.names[h.bi] || primaryName(row);
      var n2 = "";
      if (row.k === 0) {
        var feaShown = state.showG2 ? row.names[C_F2] : state.showG1 ? row.names[C_F1] : "";
        var other = row.names[C_MCP] === n1 ? feaShown : row.names[C_MCP];
        n2 = other || "";
      } else {
        var owner = DATA.classes[row.ci][0];
        var mcpC = owner[C_MCP] || owner[C_OBF];
        var feaC = (state.showG2 && owner[C_F2]) || (state.showG1 && owner[C_F1]) || "";
        var ownTxt = (mcpC && feaC && mcpC !== feaC) ? simple(mcpC) + " / " + simple(feaC) : (feaC || mcpC || "");
        n2 = ownTxt + (row.desc && row.k === 2 ? row.desc : "");
      }
      html.push(
        '<div class="item' + (i === state.sel ? " on" : "") + '" data-i="' + i + '">' +
          '<div class="l1"><span class="badge ' + (row.k === 0 ? "c" : "") + '">' + badge + "</span>" +
          '<span class="n1">' + hl(n1, hlQ) + "</span></div>" +
          '<div class="n2">' + esc(n2) + "</div>" +
        "</div>"
      );
    }
    $list.innerHTML = html.join("");
  }

  function copyText(text, btn) {
    function done() {
      if (!btn) return;
      var old = btn.textContent;
      btn.textContent = "已复制";
      setTimeout(function () { btn.textContent = old; }, 900);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  function descHtml(desc) {
    if (!desc) return '<span class="dash">—</span>';
    var out = "", last = 0, re = /L([^;]+);/g, m;
    while ((m = re.exec(desc))) {
      out += esc(desc.slice(last, m.index));
      var obf = m[1];
      var shown = (state.showG2 && obfToFeather2.get(obf)) || obf;
      out += '<span class="ty" data-obf="' + esc(obf) + '" title="' + esc(obf) + '">L' + esc(shown) + ";</span>";
      last = m.index + m[0].length;
    }
    out += esc(desc.slice(last));
    return out;
  }

  function nameRow(label, value, searchable) {
    var v = value
      ? '<span class="name">' + (searchable ? '<span class="link" data-q="' + esc(value) + '">' + esc(value) + "</span>" : esc(value)) + "</span>"
      : '<span class="dash">—</span>';
    return '<tr><td class="k">' + esc(label) + '</td><td class="v"><div class="row">' +
      v + '<span class="spacer"></span>' +
      (value ? '<button class="copy" data-copy="' + esc(value) + '">复制</button>' : "") +
      "</div></td></tr>";
  }

  function renderClass(ci) {
    var names = DATA.classes[ci][0];
    var fields = DATA.classes[ci][1], methods = DATA.classes[ci][2];
    var html = ['<div class="card"><h2>类 · ' + esc(simple(names[C_MCP] || names[C_F2] || names[C_F1] || names[C_OBF])) + "</h2><table class=" + '"names">' + ""];
    for (var i = 0; i < NS.length; i++) {
      if ((i === 2 || i === 3) && !state.showG1) continue;
      if ((i === 4 || i === 5) && !state.showG2) continue;
      html.push(nameRow(NS_LABEL[NS[i]], names[i], true));
    }
    html.push("</table></div>");

    html.push('<div class="card"><h2>字段 ' + fields.length + " · 方法 " + methods.length + "</h2>");
    html.push(memberTable(fields, 1, "字段"));
    html.push(memberTable(methods, 2, "方法"));
    html.push("</div>");
    $detail.innerHTML = html.join("");
  }

  function memberTable(list, kind, title) {
    if (!list.length) return '<div class="empty" style="padding:12px 14px">没有' + title + "。</div>";
    var th = ['<th>' + title + "（MCP）</th>"];
    if (state.showG1) th.push("<th>inter gen1</th><th>Feather gen1</th>");
    if (state.showG2) th.push("<th>inter gen2</th><th>Feather gen2</th>");
    th.push("<th>混淆名</th><th>描述符</th>");
    var html = ['<table class="mem"><thead><tr>' + th.join("") + "</tr></thead><tbody>"];
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var mcp = e[M_NAMED] || e[M_SRG] || "";
      var mcpCell = mcp
        ? '<span class="link" data-q="' + esc(mcp) + '">' + esc(mcp) + "</span>" +
          (e[M_NAMED] && e[M_SRG] && e[M_NAMED] !== e[M_SRG] ? ' <span class="dash">[' + esc(e[M_SRG]) + "]</span>" : "")
        : '<span class="dash">—</span>';
      var tds = ['<td class="m">' + mcpCell + "</td>"];
      if (state.showG1) {
        tds.push("<td>" + (e[M_I1] ? esc(e[M_I1]) : '<span class="dash">—</span>') + "</td>");
        tds.push("<td>" + (e[M_F1] ? '<span class="link" data-q="' + esc(e[M_F1]) + '">' + esc(e[M_F1]) + "</span>" : '<span class="dash">—</span>') + "</td>");
      }
      if (state.showG2) {
        tds.push("<td>" + (e[M_I2] ? esc(e[M_I2]) : '<span class="dash">—</span>') + "</td>");
        tds.push("<td>" + (e[M_F2] ? '<span class="link" data-q="' + esc(e[M_F2]) + '">' + esc(e[M_F2]) + "</span>" : '<span class="dash">—</span>') + "</td>");
      }
      tds.push("<td>" + (e[M_OBF] ? esc(e[M_OBF]) : '<span class="dash">—</span>') + "</td>");
      tds.push('<td class="m">' + descHtml(e[M_DESC]) + "</td>");
      html.push("<tr>" + tds.join("") + "</tr>");
    }
    html.push("</tbody></table>");
    return html.join("");
  }

  function renderMember(row) {
    var e = row.names;
    var owner = DATA.classes[row.ci][0];
    var kindLabel = row.k === 1 ? "字段" : "方法";
    var title = (e[M_SRG] || e[M_OBF] || e[M_F2] || "?");
    var html = ['<div class="card"><h2>' + kindLabel + " · " + esc(title) + "</h2><table class=" + '"names">'];
    var mcpCls = owner[C_MCP] || owner[C_OBF];
    var featherCls = (state.showG2 && owner[C_F2]) || (state.showG1 && owner[C_F1]) || "";
    function ownerLine(tag, val) {
      return '<div class="row"><span class="badge">' + esc(tag) + "</span>" +
        (val ? '<span class="link" data-class="' + row.ci + '">' + esc(val) + "</span>" : '<span class="dash">—</span>') +
        '<span class="spacer"></span>' +
        (val ? '<button class="copy" data-copy="' + esc(val) + '">复制</button>' : "") +
        "</div>";
    }
    html.push('<tr><td class="k">所属类</td><td class="v">' +
      ownerLine("MCP", mcpCls) +
      (featherCls ? ownerLine("Feather", featherCls) : "") +
      "</td></tr>");
    var mcp = e[M_NAMED] || e[M_SRG];
    var mcpText = mcp ? (e[M_NAMED] && e[M_SRG] && e[M_NAMED] !== e[M_SRG] ? e[M_NAMED] + "  [" + e[M_SRG] + "]" : mcp) : "";
    html.push(nameRow(NS_LABEL.mcp, mcpText, false));
    if (state.showG1) {
      html.push(nameRow(NS_LABEL.inter1, e[M_I1], false));
      html.push(nameRow(NS_LABEL.feather1, e[M_F1], true));
    }
    if (state.showG2) {
      html.push(nameRow(NS_LABEL.inter2, e[M_I2], false));
      html.push(nameRow(NS_LABEL.feather2, e[M_F2], true));
    }
    html.push(nameRow(NS_LABEL.obf, e[M_OBF], false));
    if (row.k === 2) {
      html.push('<tr><td class="k">描述符</td><td class="v">' + descHtml(e[M_DESC]) + "</td></tr>");
    }
    html.push("</table></div>");
    $detail.innerHTML = html.join("");
  }

  function renderDetail() {
    var h = state.hits[state.sel];
    if (!h) {
      $detail.innerHTML = "";
      return;
    }
    if (h.row.k === 0) renderClass(h.row.ci); else renderMember(h.row);
  }

  function showRow(i) {
    state.sel = i;
    var h = state.hits[i];
    if (!h) return;
    renderDetail();
    var items = $list.querySelectorAll(".item");
    for (var k = 0; k < items.length; k++) items[k].classList.toggle("on", +items[k].dataset.i === i);
    if (items[i] && items[i].scrollIntoView) items[i].scrollIntoView({ block: "nearest" });
  }

  function runSearch() {
    state.q = $q.value;
    var t0 = performance.now();
    if (!lower) buildLower();
    state.hits = state.q.trim() ? search(state.q) : [];
    timings.search = (performance.now() - t0).toFixed(1);
    state.sel = -1;
    renderList();
    if (state.hits.length) {
      showRow(0);
    } else {
      $detail.innerHTML = "";
    }
    $timing.textContent = "搜索 " + timings.search + " ms · 命中 " + state.hits.length;
  }

  var timer = null;
  $q.addEventListener("input", function () {
    if (timer) clearTimeout(timer);
    timer = setTimeout(runSearch, 90);
  });

  $list.addEventListener("click", function (ev) {
    var el = ev.target.closest(".item");
    if (el) showRow(+el.dataset.i);
  });

  $detail.addEventListener("click", function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.copy !== undefined) {
      copyText(t.dataset.copy, t);
      return;
    }
    if (t.dataset && t.dataset.q !== undefined) {
      $q.value = t.dataset.q;
      runSearch();
      return;
    }
    if (t.dataset && t.dataset.class !== undefined) {
      var ci = +t.dataset.class;
      $q.value = DATA.classes[ci][0][C_MCP] || DATA.classes[ci][0][C_F2];
      runSearch();
      return;
    }
    if (t.dataset && t.dataset.obf !== undefined) {
      var name = obfToFeather2.get(t.dataset.obf) || t.dataset.obf;
      $q.value = name;
      runSearch();
    }
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "/" && document.activeElement !== $q) {
      ev.preventDefault();
      $q.focus();
      return;
    }
    if (ev.key === "Escape") {
      $q.value = "";
      runSearch();
      $q.blur();
      return;
    }
    if (!state.hits.length) return;
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      if (document.activeElement !== $q && document.activeElement !== document.body) return;
      ev.preventDefault();
      var d = ev.key === "ArrowDown" ? 1 : -1;
      var next = state.sel + d;
      if (next < 0) next = 0;
      if (next >= state.hits.length) next = state.hits.length - 1;
      showRow(next);
    }
  });

  function chipSetup() {
    var nsChips = document.getElementById("nsChips");
    nsChips.addEventListener("click", function (ev) {
      var el = ev.target.closest(".chip");
      if (!el) return;
      if (el.dataset.fea !== undefined) {
        var key = el.dataset.fea === "1" ? "showG1" : "showG2";
        state[key] = !state[key];
        el.classList.toggle("on", state[key]);
        renderDetail();
        renderList();
        return;
      }
      var group = el.dataset.ns !== undefined ? "ns" : "kind";
      var v = group === "ns" ? el.dataset.ns : el.dataset.kind;
      var siblings = nsChips.querySelectorAll(".chip[" + (group === "ns" ? "data-ns" : "data-kind") + "]");
      for (var i = 0; i < siblings.length; i++) siblings[i].classList.remove("on");
      el.classList.add("on");
      if (group === "ns") {
        state.ns = v === "all" ? null : v === "inter" ? [2, 4] : v === "mcp" ? [1] : v === "obf" ? [0] : v === "feather1" ? [3] : [5];
      } else {
        state.kind = v === "all" ? null : v === "class" ? 0 : v === "field" ? 1 : 2;
      }
      runSearch();
    });
  }

  function init(version) {
    document.getElementById("verlabel").textContent = version;
    document.getElementById("verinput").value = version;
    var t0 = performance.now();
    loadScript("out/" + version + "/index.js").then(function () {
      DATA = JSON.parse(window.__MAP_JSON__);
      timings.load = performance.now() - t0;
      buildRows();
      chipSetup();
      var c = DATA.counts;
      $stat.textContent = c.classes + " 类 / " + c.fields + " 字段 / " + c.methods + " 方法 · 构建于 " + DATA.built;
      renderList();
      $timing.textContent = "加载 " + timings.load.toFixed(0) + " ms";
      if (window.requestIdleCallback) {
        requestIdleCallback(function () { buildLower(); }, { timeout: 2000 });
      }
      var preset = new URLSearchParams(location.search).get("q");
      if (preset) {
        $q.value = preset;
        runSearch();
      } else {
        $q.focus();
      }
      console.log("MAP load=" + timings.load.toFixed(1) + "ms classes=" + c.classes + " members=" + c.members);
    }).catch(function (err) {
      $list.innerHTML = '<div class="empty">加载失败：' + esc(err.message) +
        "<br><br>先运行 <b>python query.py build " + esc(version) + "</b> 生成索引。<br>" +
        "（file:// 下浏览器不允许 fetch，所以索引必须以 script 标签加载）</div>";
    });
  }

  document.getElementById("verbBtn").addEventListener("click", function () {
    var v = document.getElementById("verinput").value.trim() || "1.12.2";
    location.search = "?v=" + encodeURIComponent(v);
  });
  document.getElementById("verinput").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") document.getElementById("verbBtn").click();
  });

  var params = new URLSearchParams(location.search);
  init(params.get("v") || "1.12.2");
})();
</script>
</body>
</html>
