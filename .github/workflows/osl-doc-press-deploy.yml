name: osl-doc-press deploy

# 只在 osl-doc-press/ 有改动时构建并部署到 Cloudflare Workers（*.workers.dev）
on:
  push:
    branches: [main]
    paths:
      - 'osl-doc-press/**'
      - '.github/workflows/osl-doc-press-deploy.yml'
  workflow_dispatch:

# 同一时间只跑一个部署，新的推送顶掉正在跑的那个
concurrency:
  group: osl-doc-press-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osl-doc-press
    steps:
      - uses: actions/checkout@v4

      # wrangler 4.166 要求 Node >= 22.12；用 Node 20 时 npx 会按 engines 自动退回老版本
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: osl-doc-press/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AK }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}
        # 钉版本：4.166 起部署不再读账户级 workers.dev 子域，细粒度 token 也能拿到地址
        # （旧版会在这个 GET 上返回 10000，即使资源已经上传成功）
        # 升级时确认 changelog 里仍保留该行为，并同步 README 的说明
        run: npx --yes wrangler@4.166.0 deploy
